[project]
name = "kalshi-diamond"
version = "0.1.0"
description = "Real-time unusual volume detection on Kalshi prediction markets"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "dash>=2.14",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
